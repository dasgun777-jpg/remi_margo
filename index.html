<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0e" id="meta-theme-color">
  <meta name="color-scheme" content="dark light">
  <title>Вход в систему | Корпоративный портал РЕМИ</title>
  
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Системный шрифт Apple SF Pro & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root, [data-theme="dark"] {
      --bg: #08090f;
      --card-bg: rgba(22, 24, 35, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.4);
      --blue: #0071e3;
      --separator: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    [data-theme="light"] {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --text-secondary: rgba(0, 0, 0, 0.6);
      --text-muted: rgba(0, 0, 0, 0.4);
      --blue: #0071e3;
      --separator: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 20px 48px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Фоновые градиентные сферы Apple Liquid */
    .bg-glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 113, 227, 0.28) 0%, rgba(0, 113, 227, 0) 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
    }
    .bg-glow-2 {
      position: absolute;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(48, 209, 88, 0.2) 0%, rgba(48, 209, 88, 0) 70%);
      bottom: -120px;
      right: -120px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(50px);
    }

    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      padding: 44px 34px 32px;
      text-align: center;
      border-radius: 28px;
      background: var(--card-bg);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.92) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .brand-pill {
      display: inline-block;
      background: linear-gradient(135deg, #0071e3 0%, #0056b3 100%);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 6px 20px;
      border-radius: 9999px;
      margin-bottom: 22px;
      box-shadow: 0 4px 16px rgba(0, 113, 227, 0.4);
    }

    .login-title {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      color: var(--text);
    }
    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 26px;
      line-height: 1.45;
    }

    .login-error-alert {
      background: rgba(255, 59, 48, 0.12);
      border: 1px solid rgba(255, 59, 48, 0.35);
      color: #ff453a;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.82rem;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      line-height: 1.35;
      animation: alertSlide 0.25s ease;
    }
    [data-theme="light"] .login-error-alert {
      color: #d70015;
    }
    @keyframes alertSlide {
      0% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .google-btn-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 52px;
      margin-bottom: 24px;
    }
    #g_id_signin_btn {
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 9999px;
      overflow: hidden;
      background: transparent;
      color-scheme: dark;
    }
    #g_id_signin_btn iframe {
      color-scheme: dark !important;
      border-radius: 9999px !important;
    }

    .card-footer {
      border-top: 1px solid var(--separator);
      padding-top: 18px;
      margin-top: 8px;
    }
    .security-badge {
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    /* Индикатор проверки сессии */
    .session-checking {
      font-size: 0.88rem;
      color: var(--text-secondary);
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="login-card">
    <div>
      <div class="brand-pill">РЕМИ</div>
    </div>
    <h2 class="login-title">Корпоративный портал</h2>
    <p class="login-subtitle">Вход строго для авторизованных сотрудников компании</p>

    <div id="login-error-alert" class="login-error-alert" style="display: none;">
      <span>⚠️</span>
      <span id="login-error-text">Доступ запрещён</span>
    </div>

    <div class="google-btn-wrapper">
      <div id="session-spinner" class="session-checking">🔒 Проверка доступа...</div>
      <div id="g_id_signin_btn" style="display: none;"></div>
    </div>

    <div class="card-footer">
      <span class="security-badge">🔒 Защищено Google Cloud OAuth 2.0 &amp; Vercel Zero-Trust</span>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '758636874006-c1hhp74b9f02lttco37ojob20ljhmdrd.apps.googleusercontent.com';

    function renderGoogleBtn() {
      const btn = document.getElementById('g_id_signin_btn');
      if (!btn || typeof google === 'undefined' || !google.accounts || !google.accounts.id) return;
      btn.innerHTML = '';
      try {
        google.accounts.id.renderButton(btn, {
          theme: 'filled_black',
          size: 'large',
          type: 'standard',
          shape: 'pill',
          text: 'signin_with',
          logo_alignment: 'left',
          width: 300
        });
      } catch (e) {
        console.warn('Google renderButton error:', e);
      }
    }

    function initGoogleSignIn() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
        setTimeout(initGoogleSignIn, 200);
        return;
      }
      try {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: true
        });
        renderGoogleBtn();
      } catch (e) {
        console.error('Google initialize error:', e);
      }
    }

    function handleCredentialResponse(response) {
      if (!response || !response.credential) return;

      const alertEl = document.getElementById('login-error-alert');
      alertEl.style.display = 'none';

      const btn = document.getElementById('g_id_signin_btn');
      btn.innerHTML = '<div style="font-size: 0.9rem; color: #0071e3; padding: 12px 0; font-weight: 600;">🔒 Проверка прав доступа...</div>';

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ credential: response.credential })
      })
      .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
      .then(result => {
        if (result.ok && result.data && result.data.status === 'success') {
          // Успешный вход -> Мгновенный переход на защищенный портал
          window.location.replace('/portal');
        } else {
          const msg = (result.data && result.data.message) ? result.data.message : 'Ошибка авторизации Google';
          document.getElementById('login-error-text').innerText = msg;
          alertEl.style.display = 'flex';
          renderGoogleBtn();
        }
      })
      .catch(err => {
        console.error('Login request failed:', err);
        document.getElementById('login-error-text').innerText = 'Ошибка связи с сервером авторизации';
        alertEl.style.display = 'flex';
        renderGoogleBtn();
      });
    }

    // Проверка существующей сессии при открытии страницы
    (function checkExistingSession() {
      fetch('/api/auth/me', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (data && data.authenticated) {
            // Пользователь уже авторизован -> сразу перенаправляем на портал
            window.location.replace('/portal');
          } else {
            // Не авторизован -> показываем кнопку входа Google
            document.getElementById('session-spinner').style.display = 'none';
            document.getElementById('g_id_signin_btn').style.display = 'flex';
            initGoogleSignIn();
          }
        })
        .catch(err => {
          document.getElementById('session-spinner').style.display = 'none';
          document.getElementById('g_id_signin_btn').style.display = 'flex';
          initGoogleSignIn();
        });
    })();
  </script>
</body>
</html>
